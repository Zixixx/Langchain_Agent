[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai-agent"
version = "0.1.0"
description = "LangChain + DeepSeek hybrid AI Agent with tools, RAG, SQL, and pybind11 C++ acceleration"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.3.0",
  "chromadb>=0.5.0",
  "langchain>=0.2.14",
  "langchain-classic>=1.0.0",
  "langchain-chroma>=0.1.2",
  "langchain-community>=0.2.12",
  "langchain-core>=0.2.35",
  "langchain-huggingface>=0.0.3",
  "langchain-openai>=0.1.22",
  "langchain-text-splitters>=0.2.2",
  "numpy>=1.26.0",
  "openpyxl>=3.1.2",
  "pandas>=2.2.0",
  "pybind11>=2.12.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "python-pptx>=0.6.23",
  "sentence-transformers>=3.0.1",
  "setuptools>=68",
  "tabulate>=0.9.0",
  "typer>=0.12.3",
  "xlrd>=2.0.1"
]

[tool.setuptools]
packages = ["agent", "agent.command", "agent.db", "agent.model", "agent.rag", "agent.tools"]
py-modules = ["main"]
